<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0b0b0f"><title>Sevgilim</title>
<style>
:root{--bg:#0b0b0f;--text:#f4f1ed;--muted:#aaa5a0;--line:rgba(255,255,255,.12);--accent:#e9d8c8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:radial-gradient(circle at 50% 20%,rgba(233,216,200,.08),transparent 34%),radial-gradient(circle at 20% 80%,rgba(255,255,255,.025),transparent 28%),var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;display:flex;justify-content:center;overflow-x:hidden}
.wrap{width:min(100%,720px);min-height:100vh;padding:14vh 24px 10vh;display:flex;flex-direction:column;align-items:center;text-align:center}.intro{max-width:560px;animation:fadeUp 1.4s ease both}
.eyebrow{font-family:Arial,sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:28px}h1{font-size:clamp(42px,12vw,72px);font-weight:400;letter-spacing:-.035em;margin:0 0 30px}.message{color:#d6d1cc;font-size:clamp(17px,4.8vw,21px);line-height:1.9;margin:0 auto}
.divider{width:42px;height:1px;background:var(--line);margin:40px auto}button{appearance:none;border:1px solid rgba(233,216,200,.32);background:rgba(233,216,200,.06);color:var(--text);border-radius:999px;padding:15px 26px;font:13px Arial,sans-serif;letter-spacing:.06em;cursor:pointer;transition:.3s ease}button:hover,button:active{background:rgba(233,216,200,.13);transform:translateY(-1px)}
.video-section{display:none;width:100%;max-width:680px;margin-top:14vh;animation:fadeUp 1s ease both}.video-title{font-size:15px;color:var(--muted);margin-bottom:22px;font-family:Arial,sans-serif;letter-spacing:.08em}.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.45);background:#000}iframe{width:100%;height:100%;border:0}.closing{margin-top:54px;color:#d6d1cc;font-size:17px;line-height:1.8}.signature{margin-top:28px;color:var(--accent);font-size:16px}.heart{display:inline-block;margin-top:42px;color:#d9b9aa;font-size:17px;opacity:.8}@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><main class="wrap">
<section class="intro"><div class="eyebrow">Sana ufak bir hediyem var</div><h1>Sevgilim</h1>
<p class="message">Bazı anlar vardır;<br>üzerinden ne kadar zaman geçerse geçsin<br>insanın içinde aynı yerde kalır...</p>
<div class="divider"></div><button id="watch">♡ &nbsp; Sürprizini görmek için tıkla</button></section>
<section class="video-section" id="videoSection"><div class="video-title">Bizden kalan güzel şeyler</div>
<div class="video"><iframe src="https://www.youtube.com/embed/gewbsooYyTc?rel=0&modestbranding=1" title="Sevgilim için" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
<div class="closing">Şimdi biraz uzaktayız.<br>Ama çok yakında yine yan yana olacağız.</div><div class="signature">— Berkay</div><div class="heart">♡</div></section>
</main><script>document.getElementById("watch").addEventListener("click",function(){document.getElementById("videoSection").style.display="block";document.getElementById("videoSection").scrollIntoView({behavior:"smooth",block:"start"});});</script></body></html>
